# Interface translations: edit lib/l10n/app_<lang>.arb, then `flutter gen-l10n`
# (also runs automatically on build). English (app_en.arb) is the template.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: L10n
nullable-getter: false
untranslated-messages-file: build/untranslated.json
