# Builds Illuminati for Android, Windows, macOS and Linux.
#
# - Every push to main and every pull request: tests, then all four builds,
#   downloadable from the run's "Artifacts" section.
# - Pushing a tag like v1.0.0: the same, plus a GitHub Release with the
#   four apps attached.
# - "Run workflow" on the Actions tab builds on demand.
#
# Optional Android signing (so each new APK installs over the previous one):
# add these repository secrets under Settings -> Secrets and variables -> Actions:
#   ANDROID_KEYSTORE_BASE64  the .jks keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the APK is signed with a temporary debug key.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.32.8'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Set up the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 --decode > android/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk Illuminati-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Illuminati-android
          path: Illuminati-android.apk

  windows:
    needs: test
    # Visual Studio 2022; this Flutter version doesn't know newer ones.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: flutter build windows --release
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object build.log
          if ($LASTEXITCODE -ne 0) {
            # Also show the end of the output as an annotation on the run page.
            $tail = (Get-Content build.log -Tail 40) -join '%0A'
            Write-Output "::error title=flutter build windows failed::$tail"
            exit 1
          }
      - name: Package
        shell: pwsh
        run: |
          Rename-Item build/windows/x64/runner/Release Illuminati
          Compress-Archive build/windows/x64/runner/Illuminati Illuminati-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Illuminati-windows-x64
          path: Illuminati-windows-x64.zip

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build macos --release
      - name: Package
        # ditto keeps the app bundle's links and permissions intact.
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent Illuminati.app "$GITHUB_WORKSPACE/Illuminati-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Illuminati-macos
          path: Illuminati-macos.zip

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux --release
      - name: Package
        run: |
          mv build/linux/x64/release/bundle build/linux/x64/release/Illuminati
          tar -czf Illuminati-linux-x64.tar.gz -C build/linux/x64/release Illuminati
      - uses: actions/upload-artifact@v4
        with:
          name: Illuminati-linux-x64
          path: Illuminati-linux-x64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* docs/manual/manual-*.pdf \
            --title "Illuminati ${GITHUB_REF_NAME#v}" --generate-notes
