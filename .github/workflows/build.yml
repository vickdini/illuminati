# Builds Illuminati for Android, Windows, macOS and Linux.
#
# - Every push to main and every pull request: tests, then all four builds,
#   downloadable from the run's "Artifacts" section.
# - Pushing a tag like v1.0.0: the same, plus a GitHub Release with the
#   four apps attached.
# - "Run workflow" on the Actions tab builds on demand.
#
# Optional Android signing (so each new APK installs over the previous one):
# add these repository secrets under Settings -> Secrets and variables -> Actions:
#   ANDROID_KEYSTORE_BASE64  the .jks keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the APK is signed with a temporary debug key.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.32.8'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        # Releases (v1.2.3 tags) take their version from the tag and turn on
        # self-updates; other builds keep pubspec's version and don't update.
        # The build number always grows, as Android requires for updates.
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"; echo "UPDATE_DEFINE=--dart-define=APP_VERSION=$v" >> "$GITHUB_ENV"
          else
            v=$(sed -nE 's/^version: *([^+]+).*/\1/p' pubspec.yaml); echo "UPDATE_DEFINE=--dart-define=NO_UPDATES=1" >> "$GITHUB_ENV"
          fi
          echo "BUILD_NAME=$v" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Set up the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 --decode > android/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - run: flutter build apk --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER $UPDATE_DEFINE
      - run: mv build/app/outputs/flutter-apk/app-release.apk Illuminati-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Illuminati-android
          path: Illuminati-android.apk

  windows:
    needs: test
    # Visual Studio 2022; this Flutter version doesn't know newer ones.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Version
        # Releases (v1.2.3 tags) take their version from the tag and turn on
        # self-updates; other builds keep pubspec's version and don't update.
        # The build number always grows, as Android requires for updates.
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"; echo "UPDATE_DEFINE=--dart-define=APP_VERSION=$v" >> "$GITHUB_ENV"
          else
            v=$(sed -nE 's/^version: *([^+]+).*/\1/p' pubspec.yaml); echo "UPDATE_DEFINE=--dart-define=NO_UPDATES=1" >> "$GITHUB_ENV"
          fi
          echo "BUILD_NAME=$v" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: flutter build windows --release
        shell: pwsh
        run: |
          flutter build windows --release --build-name=$env:BUILD_NAME --build-number=$env:BUILD_NUMBER $env:UPDATE_DEFINE 2>&1 | Tee-Object build.log
          if ($LASTEXITCODE -ne 0) {
            # Also show the end of the output as an annotation on the run page.
            $tail = (Get-Content build.log -Tail 40) -join '%0A'
            Write-Output "::error title=flutter build windows failed::$tail"
            exit 1
          }
      - name: Installer
        # Inno Setup is on GitHub's Windows images; install it if it isn't.
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/DAppVersion=$env:BUILD_NAME" installer\windows\illuminati.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Move-Item build\installer\Illuminati-windows-setup.exe .
      - name: Package
        shell: pwsh
        run: |
          Rename-Item build/windows/x64/runner/Release Illuminati
          Compress-Archive build/windows/x64/runner/Illuminati Illuminati-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Illuminati-windows-setup
          path: Illuminati-windows-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Illuminati-windows-x64
          path: Illuminati-windows-x64.zip

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        # Releases (v1.2.3 tags) take their version from the tag and turn on
        # self-updates; other builds keep pubspec's version and don't update.
        # The build number always grows, as Android requires for updates.
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"; echo "UPDATE_DEFINE=--dart-define=APP_VERSION=$v" >> "$GITHUB_ENV"
          else
            v=$(sed -nE 's/^version: *([^+]+).*/\1/p' pubspec.yaml); echo "UPDATE_DEFINE=--dart-define=NO_UPDATES=1" >> "$GITHUB_ENV"
          fi
          echo "BUILD_NAME=$v" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build macos --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER $UPDATE_DEFINE
      - name: Package
        # ditto keeps the app bundle's links and permissions intact.
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent Illuminati.app "$GITHUB_WORKSPACE/Illuminati-macos.zip"
      - name: Disk image
        # The usual Mac installer: open it and drag Illuminati to Applications.
        run: |
          mkdir dmg
          cp -R build/macos/Build/Products/Release/Illuminati.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Illuminati -srcfolder dmg -ov -format UDZO Illuminati-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Illuminati-macos-dmg
          path: Illuminati-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Illuminati-macos
          path: Illuminati-macos.zip

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        # Releases (v1.2.3 tags) take their version from the tag and turn on
        # self-updates; other builds keep pubspec's version and don't update.
        # The build number always grows, as Android requires for updates.
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"; echo "UPDATE_DEFINE=--dart-define=APP_VERSION=$v" >> "$GITHUB_ENV"
          else
            v=$(sed -nE 's/^version: *([^+]+).*/\1/p' pubspec.yaml); echo "UPDATE_DEFINE=--dart-define=NO_UPDATES=1" >> "$GITHUB_ENV"
          fi
          echo "BUILD_NAME=$v" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER $UPDATE_DEFINE
      - name: AppImage
        # One file that runs on most distributions and updates itself.
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          mkdir AppDir
          cp -r build/linux/x64/release/bundle/. AppDir/
          cp installer/linux/AppRun installer/linux/illuminati.desktop AppDir/
          cp assets/icon/app_icon.png AppDir/illuminati.png
          chmod +x AppDir/AppRun AppDir/illuminati
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir Illuminati-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: Illuminati-linux-appimage
          path: Illuminati-linux-x86_64.AppImage
      - name: Package
        run: |
          mv build/linux/x64/release/bundle build/linux/x64/release/Illuminati
          tar -czf Illuminati-linux-x64.tar.gz -C build/linux/x64/release Illuminati
      - uses: actions/upload-artifact@v4
        with:
          name: Illuminati-linux-x64
          path: Illuminati-linux-x64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* docs/manual/manual-*.pdf \
            --title "Illuminati ${GITHUB_REF_NAME#v}" --generate-notes
